<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>即兴主持 · 向里走的人</title>
  <meta name="description" content="心灵赋能演讲俱乐部即兴演讲主持。主题：向里走的人。每题 2 分钟，本轮不重复。" />
  <meta name="theme-color" content="#241c16" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%2210%22%20fill%3D%22%232a211b%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2215%22%20r%3D%227%22%20fill%3D%22none%22%20stroke%3D%22%23e2b48a%22%20stroke-width%3D%221.6%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2213.5%22%20r%3D%222.2%22%20fill%3D%22%23f6efe6%22%2F%3E%0A%3C%2Fsvg%3E%0A" />
  <style>
:root {
  --bg: #1c1612;
  --bg-2: #2a211b;
  --ink: #f6efe6;
  --muted: #cbb9a6;
  --line: rgba(232, 214, 190, 0.18);
  --card: rgba(42, 32, 26, 0.82);
  --blue: #c9b7a2;
  --gold: #e2b48a;
  --amber: #e0b15a;
  --red: #e07a72;
  --ok: #b7c7a8;
  --shadow: 0 24px 70px rgba(28, 16, 10, 0.38);
  --serif: "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --ring: 326.73;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(900px 520px at 0% -10%, rgba(176, 92, 74, 0.18), transparent 58%),
    radial-gradient(800px 480px at 100% 0%, rgba(226, 180, 138, 0.16), transparent 55%),
    radial-gradient(700px 420px at 70% 100%, rgba(120, 140, 112, 0.16), transparent 60%),
    linear-gradient(180deg, #241c16 0%, #1a1512 52%, #14110e 100%);
  min-height: 100vh;
}
body.hints-off .hints { display: none; }
button, input { font-family: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.45; }

.atmosphere { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(8px);
}
.orb-a {
  width: 460px; height: 460px; left: -140px; bottom: -160px;
  background: radial-gradient(circle, rgba(176, 104, 82, 0.22), transparent 68%);
}
.orb-b {
  width: 320px; height: 320px; right: 6%; top: 12%;
  background: radial-gradient(circle, rgba(226, 196, 160, 0.14), transparent 70%);
}

.top, .layout, .foot { position: relative; z-index: 1; }
.top {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: flex-end;
  padding: 28px 36px 8px;
}
.club {
  margin: 0 0 6px;
  letter-spacing: 0.22em;
  font-size: 13px;
  color: var(--gold);
}
h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(28px, 3vw, 42px);
  font-weight: 700;
  letter-spacing: 0.02em;
}
.rule { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.top-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
.remain {
  margin: 0 8px 0 0;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(226, 180, 138, 0.14);
  color: var(--gold);
  font-weight: 700;
}
button, .ghost {
  border: 1px solid var(--line);
  background: rgba(16, 42, 78, 0.8);
  color: var(--ink);
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 14px;
}
button:hover:not(:disabled) { border-color: rgba(158, 194, 255, 0.7); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.ghost { background: transparent; }
#resetBtn { color: var(--gold); }

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(280px, 0.8fr);
  gap: 22px;
  padding: 18px 36px 12px;
  align-items: start;
}

.stage, .board-wrap {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 28px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}
.stage { min-height: 640px; padding: 28px; overflow: hidden; }

.idle {
  min-height: 580px;
  display: grid;
  place-items: center;
  text-align: center;
  align-content: center;
  gap: 14px;
}
.deck {
  width: 180px; height: 124px; position: relative; margin-bottom: 8px;
}
.deck i {
  position: absolute; inset: 0;
  border-radius: 16px;
  background:
    linear-gradient(160deg, rgba(242, 220, 196, 0.22), transparent 42%),
    linear-gradient(180deg, #6a4638, #2c211c);
  border: 1px solid rgba(226, 180, 138, 0.45);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
}
.deck i:nth-child(1) { transform: rotate(-8deg) translateX(-12px); }
.deck i:nth-child(2) { transform: rotate(6deg) translateX(12px); }
.deck i:nth-child(3) { transform: rotate(-1deg); }
.idle h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 36px;
}
.idle p { margin: 0; color: var(--muted); max-width: 460px; line-height: 1.7; }
.draw-btn, .next-btn {
  margin-top: 8px;
  background: linear-gradient(180deg, #8d5a45, #5c3a2e);
  border-color: rgba(226, 180, 138, 0.55);
  color: #fff8f1;
  font-size: 18px;
  padding: 14px 28px;
  box-shadow: 0 10px 30px rgba(20, 60, 120, 0.45);
}
.draw-btn { font-size: 22px; padding: 16px 36px; }
.draw-btn:hover:not(:disabled), .next-btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.live { display: grid; gap: 22px; }
.live-grid {
  display: grid;
  grid-template-columns: 168px minmax(0, 1fr);
  gap: 28px;
  align-items: center;
}
.scene-frame {
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  aspect-ratio: 3 / 4;
  background:
    radial-gradient(circle at 50% 42%, rgba(242, 214, 184, 0.2), transparent 42%),
    linear-gradient(180deg, #3a2c24, #241c17);
  border: 1px solid rgba(226, 180, 138, 0.28);
}
.motif {
  position: absolute;
  inset: 18% 18% 28%;
  border-radius: 50%;
  border: 1px solid rgba(242, 220, 196, 0.55);
  box-shadow: inset 0 0 0 10px rgba(226, 180, 138, 0.08), 0 0 40px rgba(176, 104, 82, 0.18);
}
.motif::after {
  content: "";
  position: absolute;
  left: 50%; top: 18%;
  width: 42%; height: 42%;
  border-radius: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(246, 228, 206, 0.85), rgba(226, 180, 138, 0.15) 70%, transparent 72%);
}
.scene-frame figcaption {
  position: absolute; left: 12px; right: 12px; bottom: 14px;
  text-align: center;
  color: var(--gold); font-size: 12px; letter-spacing: 0.18em;
}
.kicker {
  margin: 0 0 8px;
  color: var(--gold);
  letter-spacing: 0.16em;
  font-size: 13px;
}
.question {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(26px, 2.5vw, 36px);
  line-height: 1.45;
  font-weight: 700;
}
.hints { display: grid; gap: 10px; margin-top: 18px; }
.hint {
  margin: 0;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(246, 236, 224, 0.05);
  border: 1px solid var(--line);
  color: #f0e4d6;
  line-height: 1.7;
}
.hint b {
  display: block;
  margin-bottom: 2px;
  color: #c9d3bf;
  font-size: 12px;
  letter-spacing: 0.18em;
  font-weight: 500;
}
.hint.ask {
  background: rgba(226, 180, 138, 0.08);
}
.hint.ask b { color: var(--gold); }

.clock-row {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 22px;
  align-items: center;
  padding: 8px 8px 0;
  border-top: 1px solid var(--line);
}
.clock {
  width: 210px; height: 210px; position: relative; color: var(--blue);
}
.clock svg { width: 100%; height: 100%; }
.ring-track, .ring-value { fill: none; stroke-width: 7; }
.ring-track { stroke: rgba(255, 255, 255, 0.08); }
.ring-value {
  stroke: currentColor;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 60px 60px;
  stroke-dasharray: var(--ring);
}
.digits {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
  font-size: 52px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: currentColor;
}
.clock-copy .phase {
  margin: 0;
  font-family: var(--serif);
  font-size: 32px;
}
.clock-copy .sub { margin: 6px 0 0; color: var(--muted); line-height: 1.6; }
.clock.is-early { color: #f3e6d4; }
.clock.is-middle { color: var(--blue); }
.clock.is-close { color: var(--amber); }
.clock.is-over { color: var(--red); }
.clock.is-over .digits,
.clock.is-over .phase,
.phase.is-over { color: var(--red); }
.clock.is-over { animation: pulse 1.1s ease-in-out infinite; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

.board-wrap { padding: 18px 16px 16px; }
.board-head h2 { margin: 0 4px; font-size: 18px; font-family: var(--serif); }
.board-head p { margin: 4px 4px 12px; color: var(--muted); font-size: 12px; }
.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.card {
  width: 100%;
  text-align: left;
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 10px;
  align-items: center;
  border-radius: 16px;
  padding: 8px;
  background: rgba(20, 14, 10, 0.35);
}
.seal {
  width: 52px; height: 40px; border-radius: 999px;
  display: grid; place-items: center;
  background: linear-gradient(180deg, #6d4638, #3d2a22);
  color: var(--gold);
  border: 1px dashed rgba(226, 180, 138, 0.5);
  font-size: 12px;
}
.card .no { display: block; color: var(--gold); font-size: 12px; letter-spacing: 0.08em; }
.card .name { display: block; font-size: 14px; line-height: 1.45; }
.card.is-sealed .name { color: var(--muted); }
.card.is-active {
  border-color: rgba(228, 194, 122, 0.8);
  box-shadow: inset 0 0 0 1px rgba(228, 194, 122, 0.35);
}
.card.is-done { opacity: 0.78; }
.card.is-hot { transform: translateX(4px); border-color: var(--gold); }
.card.shake { animation: shake 0.35s linear; }

.foot {
  padding: 4px 36px 22px;
  color: var(--muted);
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.foot p { margin: 0; }

.modal {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  background: rgba(4, 10, 20, 0.62);
}
.modal[hidden] { display: none; }
.modal-card {
  width: min(440px, calc(100% - 32px));
  padding: 24px;
  border-radius: 22px;
  background: #10243f;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.modal-card p { margin: 0 0 18px; font-size: 18px; line-height: 1.6; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

.burst { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.burst i {
  position: absolute; top: 42%; left: 46%;
  width: 8px; height: 14px; border-radius: 8px;
  background: var(--gold);
  animation: rise 900ms ease-out forwards;
}
.burst i:nth-child(3n) { background: var(--blue); height: 8px; }
.burst i:nth-child(4n) { background: #f3efe4; }

.flash {
  position: fixed; left: 50%; top: 18%;
  transform: translateX(-50%);
  z-index: 6;
  padding: 10px 22px;
  border-radius: 999px;
  background: rgba(255, 93, 108, 0.16);
  border: 1px solid rgba(255, 93, 108, 0.7);
  color: var(--red);
  font-family: var(--serif);
  font-size: 28px;
  letter-spacing: 0.2em;
}
.flash[hidden] { display: none; }

.stale {
  margin: 0 0 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(240, 193, 77, 0.1);
  color: var(--amber);
}

@keyframes pulse {
  0%, 100% { filter: saturate(1); }
  50% { filter: saturate(1.3) brightness(1.08); }
}
@keyframes shake {
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
@keyframes rise {
  to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; }
}

@media (max-width: 980px) {
  .top, .layout, .foot { padding-left: 16px; padding-right: 16px; }
  .top { flex-direction: column; align-items: stretch; }
  .layout { grid-template-columns: 1fr; }
  .live-grid, .clock-row { grid-template-columns: 1fr; }
  .stage { min-height: 0; }
  .clock { margin: 0 auto; }
  .foot { flex-direction: column; }
}

@media (prefers-reduced-motion: reduce) {
  .clock.is-over, .burst i, .card.shake { animation: none; }
}

</style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
  </div>

  <header class="top">
    <div class="brand">
      <p class="club">心灵赋能演讲俱乐部</p>
      <h1>向里走的人</h1>
      <p class="rule">即兴演讲主持 · 每问 2 分钟 · 本轮每问只抽一次</p>
    </div>
    <div class="top-actions">
      <p class="remain" id="remain" aria-live="polite">剩余 10 问</p>
      <button type="button" id="soundBtn" aria-pressed="true">声音开</button>
      <button type="button" id="hintBtn" aria-pressed="true">听什么开</button>
      <button type="button" id="fullBtn">全屏</button>
      <button type="button" id="resetBtn" class="ghost">新一轮</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage" aria-live="polite"></section>
    <aside class="board-wrap">
      <div class="board-head">
        <h2>问题</h2>
        <p>未启的问题，点编号也可以指定</p>
      </div>
      <ol class="board" id="board"></ol>
    </aside>
  </main>

  <footer class="foot">
    <p>空格：暂停或继续 · N：抽下一问 · 本轮进度记在这台浏览器里</p>
    <p id="rehearseNote" hidden>彩排模式：可用「快进 30 秒」预览到点变红。</p>
  </footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalText">
      <p id="modalText"></p>
      <div class="modal-actions">
        <button type="button" id="modalCancel" class="ghost">先留在这题</button>
        <button type="button" id="modalOk">确定</button>
      </div>
    </div>
  </div>
  <div class="burst" id="burst" aria-hidden="true"></div>
  <div class="flash" id="flash" hidden>时间到</div>

  <script>
const TOPICS = [
  {
    id: 1,
    title: "你第一次对自己说“我可能需要帮助”，是在什么时候？",
    see: "把崩溃当终点，还是当入口。答“没有过”的人，要么还没到那个点，要么不愿承认。",
    ask: "那句话你说出口了吗？"
  },
  {
    id: 2,
    title: "有没有一个标签，曾经替你解释过自己？",
    see: "借工具认识自己，还是拿工具给自己定案。用过测评的人多，能说出“后来我不用了”的人少。",
    ask: "是它解释了你，还是你开始活成它说的样子？"
  },
  {
    id: 3,
    title: "你的身体，替你记住了哪一段不愿承认的情绪？",
    see: "身心是否分离。能立刻说出部位和场景的人，通常已经自己和解过一轮。",
    ask: "那个情绪，当时你最想对谁说什么？"
  },
  {
    id: 4,
    title: "谁的一句话，让你第一次真正看见了自己？",
    see: "他把谁当镜子——亲近的人、专业人士，还是一个陌生人的无心之言。",
    ask: "那句话你当时信了吗？"
  },
  {
    id: 5,
    title: "你一个人待着的时候，是在躲，还是在整理？",
    see: "独处的性质。判断标准不是时长，是他出来之后更清楚，还是更空。",
    ask: "你最近一次独处很久，是在什么事之后？"
  },
  {
    id: 6,
    title: "你做过哪件“没什么用”的事，却真的救了自己？",
    see: "他的价值排序里有没有“无用”的位置。答得越快的人，通常都有一件不太体面的爱好。",
    ask: "如果这事对升职加薪毫无帮助，你还会做吗？"
  },
  {
    id: 7,
    title: "你最近一次主动走向让你害怕的东西，是什么？",
    see: "征服型还是打开型——走过去之后是更硬了，还是更软了。",
    ask: "过去之后，你改变了对自己的哪个判断？"
  },
  {
    id: 8,
    title: "你为了什么，主动放弃过另一件同样重要的事？",
    see: "取舍的颗粒度。真做过取舍的人会讲出具体代价，没做过的人只会讲道理。",
    ask: "你心疼的是那件事，还是那个“本来可以更好”的自己？"
  },
  {
    id: 9,
    title: "有没有哪一刻，你突然不想要你一直想要的东西了？",
    see: "价值观有没有被检验过。没被检验的人，会把“想要”说得特别顺。",
    ask: "不想要之后，你换上了什么？"
  },
  {
    id: 10,
    title: "你向内看的那些收获，有没有一次真的接住过别人？",
    see: "向内求有没有出口。一次性善举和持续利他，一问就分。",
    ask: "那次之后，你做过第二次吗？"
  }
];

const LIMIT = 120000;
const STORE = "mind-inward-speech-v2";
const RING = 326.73;
const rehearse = new URLSearchParams(location.search).has("rehearse");

const stage = document.getElementById("stage");
const board = document.getElementById("board");
const remain = document.getElementById("remain");
const soundBtn = document.getElementById("soundBtn");
const hintBtn = document.getElementById("hintBtn");
const fullBtn = document.getElementById("fullBtn");
const resetBtn = document.getElementById("resetBtn");
const modal = document.getElementById("modal");
const modalText = document.getElementById("modalText");
const modalOk = document.getElementById("modalOk");
const modalCancel = document.getElementById("modalCancel");
const flash = document.getElementById("flash");
const rehearseNote = document.getElementById("rehearseNote");

let state = load();
let raf = 0;
let busy = false;
let audioCtx = null;
let modalResolver = null;

function fresh() {
  return {
    drawn: [],
    active: null,
    accumulated: 0,
    resumedAt: 0,
    running: false,
    chimed: false,
    sound: true,
    hints: true
  };
}

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE) || "null");
    if (!raw || !Array.isArray(raw.drawn)) return fresh();
    const next = Object.assign(fresh(), raw);
    next.drawn = next.drawn.filter((id) => TOPICS.some((topic) => topic.id === id));
    if (!TOPICS.some((topic) => topic.id === next.active)) next.active = null;
    if (next.running) {
      const elapsed = next.accumulated + Math.max(0, Date.now() - next.resumedAt);
      if (elapsed > 30 * 60 * 1000) {
        next.accumulated = Math.min(elapsed, LIMIT + 60000);
        next.running = false;
        next.stale = true;
      }
    }
    return next;
  } catch (err) {
    return fresh();
  }
}

function save() {
  localStorage.setItem(STORE, JSON.stringify(state));
}

function topicById(id) {
  return TOPICS.find((topic) => topic.id === id);
}

function remaining() {
  return TOPICS.filter((topic) => !state.drawn.includes(topic.id));
}

function elapsed() {
  if (!state.active) return 0;
  const extra = state.running ? Math.max(0, Date.now() - state.resumedAt) : 0;
  return state.accumulated + extra;
}

function pad(n) {
  return String(n).padStart(2, "0");
}

function format(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  return pad(Math.floor(total / 60)) + ":" + pad(total % 60);
}

function phaseOf(ms) {
  if (ms >= LIMIT) return { key: "over", label: "已超时", note: "超过 2 分钟，时间已变红。可以轻轻收住。" };
  if (ms >= 90000) return { key: "close", label: "收尾", note: "还剩不到 30 秒，可以把追问递出去。" };
  if (ms >= 60000) return { key: "middle", label: "展开", note: "已过 1 分钟。听他怎么说，先别接话。" };
  return { key: "early", label: "开场", note: "2 分钟。先让这一问自己落地。" };
}

function ensureAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!audioCtx) audioCtx = new Ctx();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function tone(freq, at, dur, gain) {
  const ctx = ensureAudio();
  if (!ctx || !state.sound) return;
  const osc = ctx.createOscillator();
  const amp = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  amp.gain.setValueAtTime(0.0001, at);
  amp.gain.exponentialRampToValueAtTime(gain, at + 0.02);
  amp.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  osc.connect(amp);
  amp.connect(ctx.destination);
  osc.start(at);
  osc.stop(at + dur + 0.02);
}

function playDraw() {
  const ctx = ensureAudio();
  if (!ctx) return;
  tone(523, ctx.currentTime, 0.12, 0.03);
  tone(784, ctx.currentTime + 0.08, 0.18, 0.04);
}

function playOver() {
  const ctx = ensureAudio();
  if (!ctx) return;
  tone(880, ctx.currentTime, 0.18, 0.05);
  tone(1175, ctx.currentTime + 0.16, 0.28, 0.04);
}

function burst() {
  const root = document.getElementById("burst");
  root.replaceChildren();
  for (let i = 0; i < 16; i += 1) {
    const bit = document.createElement("i");
    bit.style.setProperty("--x", (Math.random() * 280 - 140) + "px");
    bit.style.setProperty("--y", (Math.random() * -220 - 40) + "px");
    bit.style.setProperty("--r", (Math.random() * 80 - 40) + "deg");
    root.appendChild(bit);
  }
}

function ask(message, okText) {
  modalText.textContent = message;
  modalOk.textContent = okText || "确定";
  modal.hidden = false;
  modalOk.focus();
  return new Promise((resolve) => {
    modalResolver = resolve;
  });
}

function closeModal(answer) {
  modal.hidden = true;
  if (modalResolver) modalResolver(answer);
  modalResolver = null;
}

function renderHeader() {
  const left = remaining().length;
  remain.textContent = left ? "剩余 " + left + " 问" : "本轮已抽完";
  soundBtn.textContent = state.sound ? "声音开" : "声音关";
  soundBtn.setAttribute("aria-pressed", String(state.sound));
  hintBtn.textContent = state.hints ? "听什么开" : "听什么关";
  hintBtn.setAttribute("aria-pressed", String(state.hints));
  document.body.classList.toggle("hints-off", !state.hints);
  rehearseNote.hidden = !rehearse;
}

function renderBoard() {
  board.replaceChildren();
  TOPICS.forEach((topic) => {
    const done = state.drawn.includes(topic.id);
    const active = state.active === topic.id;
    const item = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card" + (done ? " is-done" : " is-sealed") + (active ? " is-active" : "");
    btn.dataset.id = String(topic.id);
    const seal = document.createElement("span");
    seal.className = "seal";
    seal.textContent = done ? pad(topic.id) : "未启";
    btn.appendChild(seal);
    const text = document.createElement("span");
    const no = document.createElement("span");
    no.className = "no";
    no.textContent = pad(topic.id) + (active ? " · 正在说" : done ? " · 已抽" : " · 未启");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = done ? topic.title : "还盖着的问题";
    text.append(no, name);
    btn.append(text);
    btn.addEventListener("click", () => drawSpecific(topic.id, btn));
    item.appendChild(btn);
    board.appendChild(item);
  });
}

function renderStage() {
  stage.replaceChildren();
  const topic = topicById(state.active);
  if (!topic) {
    const idle = document.createElement("div");
    idle.className = "idle";
    const deck = document.createElement("div");
    deck.className = "deck";
    deck.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
    const title = document.createElement("h2");
    title.textContent = remaining().length ? "十问都还盖着" : "这一轮十问都走过了";
    const copy = document.createElement("p");
    copy.textContent = remaining().length
      ? "抽到哪一问，就请哪一位向里走两分钟。同一轮里，问过的不再出现。"
      : "可以开始新一轮，十个问题会重新盖上。";
    idle.append(deck, title, copy);
    if (remaining().length) {
      const draw = document.createElement("button");
      draw.type = "button";
      draw.className = "draw-btn";
      draw.textContent = "抽取下一问";
      draw.addEventListener("click", () => drawRandom());
      idle.appendChild(draw);
    } else {
      const again = document.createElement("button");
      again.type = "button";
      again.className = "draw-btn";
      again.textContent = "开始新一轮";
      again.addEventListener("click", resetRound);
      idle.appendChild(again);
    }
    stage.appendChild(idle);
    return;
  }

  if (state.stale) {
    const note = document.createElement("p");
    note.className = "stale";
    note.textContent = "上次这题的计时放得太久，已经先暂停。可以继续，也可以重计。";
    stage.appendChild(note);
  }

  const live = document.createElement("div");
  live.className = "live";
  const grid = document.createElement("div");
  grid.className = "live-grid";

  const figure = document.createElement("figure");
  figure.className = "scene-frame motif-" + topic.id;
  const motif = document.createElement("div");
  motif.className = "motif";
  motif.setAttribute("aria-hidden", "true");
  const cap = document.createElement("figcaption");
  cap.textContent = "第 " + pad(topic.id) + " 问";
  figure.append(motif, cap);

  const copy = document.createElement("div");
  const kicker = document.createElement("p");
  kicker.className = "kicker";
  kicker.textContent = "主持提问 " + pad(topic.id) + " / 10";
  const question = document.createElement("h2");
  question.className = "question";
  question.textContent = topic.title;
  const hints = document.createElement("div");
  hints.className = "hints";
  [["听什么", topic.see, "see"], ["追问", topic.ask, "ask"]].forEach((part) => {
    const p = document.createElement("p");
    p.className = "hint " + part[2];
    const b = document.createElement("b");
    b.textContent = part[0];
    p.append(b, document.createTextNode(part[1]));
    hints.appendChild(p);
  });
  copy.append(kicker, question, hints);
  grid.append(figure, copy);

  const row = document.createElement("div");
  row.className = "clock-row";
  const clock = document.createElement("div");
  clock.className = "clock";
  clock.id = "clock";
  clock.innerHTML =
    '<svg viewBox="0 0 120 120" aria-hidden="true">' +
    '<circle class="ring-track" cx="60" cy="60" r="52"></circle>' +
    '<circle class="ring-value" id="ring" cx="60" cy="60" r="52"></circle>' +
    "</svg>" +
    '<div class="digits" id="digits">00:00</div>';
  const words = document.createElement("div");
  words.className = "clock-copy";
  const phase = document.createElement("p");
  phase.className = "phase";
  phase.id = "phase";
  const sub = document.createElement("p");
  sub.className = "sub";
  sub.id = "phaseNote";
  const controls = document.createElement("div");
  controls.className = "controls";
  controls.append(
    makeButton(state.running ? "暂停" : "继续", toggleRun, "ghost"),
    makeButton("本题重计", restartTimer, "ghost"),
    makeButton(remaining().length ? "抽取下一问" : "问题已抽完", drawRandom, "next-btn")
  );
  if (rehearse) controls.appendChild(makeButton("快进 30 秒", jumpThirty, "ghost"));
  words.append(phase, sub, controls);
  row.append(clock, words);
  live.append(grid, row);
  stage.appendChild(live);
  renderClock();
}

function makeButton(text, onClick, cls) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = cls || "";
  btn.textContent = text;
  if (!remaining().length && text === "问题已抽完") btn.disabled = true;
  btn.addEventListener("click", onClick);
  return btn;
}

function renderClock() {
  const clock = document.getElementById("clock");
  const digits = document.getElementById("digits");
  const ring = document.getElementById("ring");
  const phase = document.getElementById("phase");
  const note = document.getElementById("phaseNote");
  if (!clock || !digits) return;
  const ms = elapsed();
  const info = phaseOf(ms);
  digits.textContent = format(ms);
  phase.textContent = info.label;
  phase.classList.toggle("is-over", info.key === "over");
  note.textContent = info.note;
  clock.className = "clock is-" + info.key;
  const progress = Math.min(ms, LIMIT) / LIMIT;
  ring.style.strokeDashoffset = String(RING * (1 - progress));
  if (ms >= LIMIT && !state.chimed) {
    state.chimed = true;
    save();
    playOver();
    showFlash();
  }
}

function showFlash() {
  flash.hidden = false;
  window.setTimeout(() => {
    flash.hidden = true;
  }, 1600);
}

function render() {
  renderHeader();
  renderBoard();
  renderStage();
  if (state.running) startLoop();
}

function startLoop() {
  cancelAnimationFrame(raf);
  const tick = () => {
    renderClock();
    if (state.running) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

function stopLoop() {
  cancelAnimationFrame(raf);
  renderClock();
}

function startTimer() {
  state.accumulated = 0;
  state.resumedAt = Date.now();
  state.running = true;
  state.chimed = false;
  state.stale = false;
}

function toggleRun() {
  if (!state.active) return;
  if (state.running) {
    state.accumulated = elapsed();
    state.running = false;
    save();
    stopLoop();
    render();
    return;
  }
  state.resumedAt = Date.now();
  state.running = true;
  state.stale = false;
  save();
  render();
}

function restartTimer() {
  if (!state.active) return;
  startTimer();
  save();
  render();
}

function jumpThirty() {
  if (!state.active) return;
  state.accumulated += 30000;
  save();
  renderClock();
}

async function drawRandom() {
  ensureAudio();
  if (busy) return;
  const left = remaining();
  if (!left.length) return;
  busy = true;
  try {
    if (state.active && state.running && elapsed() < LIMIT) {
      const ok = await ask("这一问还没到 2 分钟，确定抽下一问？", "抽下一问");
      if (!ok) return;
    }
    const pool = remaining();
    const pick = pool[Math.floor(Math.random() * pool.length)];
    await reveal(pick.id);
  } finally {
    busy = false;
  }
}

async function drawSpecific(id, button) {
  ensureAudio();
  if (busy) return;
  if (state.drawn.includes(id)) {
    button.classList.remove("shake");
    void button.offsetWidth;
    button.classList.add("shake");
    return;
  }
  busy = true;
  try {
    if (state.active && state.running && elapsed() < LIMIT) {
      const ok = await ask("这一问还没到 2 分钟，确定换指定问题？", "换这一问");
      if (!ok) return;
    }
    await reveal(id);
  } finally {
    busy = false;
  }
}

function sleep(ms) {
  return new Promise((resolve) => window.setTimeout(resolve, ms));
}

async function animateShuffle(id) {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const steps = reduce || remaining().length < 2 ? 1 : 12;
  for (let i = 0; i < steps; i += 1) {
    const pool = remaining();
    const shown = i === steps - 1 ? id : pool[Math.floor(Math.random() * pool.length)].id;
    document.querySelectorAll(".card").forEach((card) => {
      card.classList.toggle("is-hot", card.dataset.id === String(shown));
    });
    await sleep(reduce ? 0 : 70);
  }
}

async function reveal(id) {
  if (state.drawn.includes(id)) return;
  await animateShuffle(id);
  state.drawn.push(id);
  state.active = id;
  startTimer();
  save();
  render();
  playDraw();
  burst();
}

async function resetRound() {
  if (!state.drawn.length && !state.active) return;
  const ok = await ask("新一轮会把十个问题重新盖上，当前计时也会清掉。", "开始新一轮");
  if (!ok) return;
  const sound = state.sound;
  const hints = state.hints;
  state = fresh();
  state.sound = sound;
  state.hints = hints;
  save();
  cancelAnimationFrame(raf);
  render();
}

document.addEventListener("keydown", (event) => {
  if (event.target && (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA")) return;
  if (event.code === "Space") {
    event.preventDefault();
    if (busy || !modal.hidden) return;
    if (state.active) toggleRun();
    else drawRandom();
  }
  if (event.key === "n" || event.key === "N") {
    if (busy || !modal.hidden) return;
    drawRandom();
  }
});

soundBtn.addEventListener("click", () => {
  state.sound = !state.sound;
  if (state.sound) ensureAudio();
  save();
  renderHeader();
});
hintBtn.addEventListener("click", () => {
  state.hints = !state.hints;
  save();
  renderHeader();
});
fullBtn.addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});
resetBtn.addEventListener("click", resetRound);
modalOk.addEventListener("click", () => closeModal(true));
modalCancel.addEventListener("click", () => closeModal(false));
modal.addEventListener("click", (event) => {
  if (event.target === modal) closeModal(false);
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !modal.hidden) closeModal(false);
});

render();
if (state.running) startLoop();

</script>
</body>
</html>
